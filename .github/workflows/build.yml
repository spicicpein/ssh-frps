name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build winssh-tunnel.exe
        run: |
          go version
          go env
          dir
          type go.mod
          echo "Downloading dependencies..."
          go mod download -x
          echo "Building..."
          go build -v -x -o winssh-tunnel.exe .
          dir winssh-tunnel.exe

      - name: Create release files
        run: |
          mkdir release
          copy winssh-tunnel.exe release/
          copy frpc.toml.example release/
          copy setup.bat release/
          copy README.md release/
          copy QUICKSTART.md release/
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
