name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check exe exists
        run: |
          ls -lh winssh-tunnel.exe
          file winssh-tunnel.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            winssh-tunnel.exe
            README.md
            QUICKSTART.md
            frpc.toml.example
            setup.bat
          body: |
            ## winssh-tunnel v0.1.0

            Полнофункциональный SSH-сервер с FRP-туннелированием для Windows.

            ### Что включено в exe (~9.4 МБ):
            - ✅ **SSH Server** — полный SSH протокол (gliderlabs/ssh)
            - ✅ **SFTP** — передача файлов (pkg/sftp)
            - ✅ **FRP Client** — туннель через frp (gofrp/tiny-frpc)
            - ✅ **ConPTY** — интерактивный shell на Windows 10 1809+
            - ✅ Монолитный exe, без внешних DLL

            ### Быстрый старт:
            1. Скопируй `frpc.toml.example` → `frpc.toml`
            2. Заполни адрес VPS и пароль
            3. Запусти `winssh-tunnel.exe`
            4. Подключайся: `ssh -p 6000 user@твой.vps.com`

            Подробнее → `QUICKSTART.md`
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
