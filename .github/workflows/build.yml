name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download dependencies
        run: go mod download

      - name: Build winssh-tunnel.exe
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -v -o winssh-tunnel.exe .
          ls -la winssh-tunnel.exe

      - name: Create release files
        run: |
          mkdir release
          copy winssh-tunnel.exe release/
          copy frpc.toml.example release/
          copy setup.bat release/
          copy README.md release/
          copy QUICKSTART.md release/
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
