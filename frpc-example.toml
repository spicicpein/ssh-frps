# ══════════════════════════════════════════════════════════════════════════
#  frpc-example.toml — пример конфига winssh-tunnel
#
#  Скопируй этот файл в frpc.toml (рядом с winssh-tunnel.exe, либо в любое
#  другое место — тогда укажи путь через -c/--config, см. README.md) и
#  заполни своими данными. Секции ниже идут в порядке, в котором имеет
#  смысл их заполнять при первой настройке.
# ══════════════════════════════════════════════════════════════════════════


# ── 1. Подключение к frps ────────────────────────────────────────────────────

# Адрес твоего VPS (IP или домен) — где крутится frps.
serverAddr = "ВАШ_VPS_IP_ИЛИ_ДОМЕН"

# ВАЖНО: это порт sshTunnelGateway.bindPort из frps.toml на VPS,
# а НЕ обычный bindPort самого frps! Это два РАЗНЫХ порта.
# На frps должно быть примерно так:
#   bindPort = 7000                    # обычный порт frps (НЕ этот)
#   sshTunnelGateway.bindPort = 2200   # вот этот нам и нужен
serverPort = 2200

# Токен — должен СОВПАДАТЬ с auth.token в frps.toml на VPS. Это общий
# секрет между твоим клиентом и сервером frps, защищает от посторонних
# подключений к твоему frps.
auth.token = "ВАШ_AUTH_TOKEN"


# ── 2. Подключение через SOCKS5/HTTP-прокси (опционально) ───────────────────

# Если у Windows-машины нет прямого выхода в интернет (сидит за
# корпоративным/локальным прокси) — можно подключаться к frps через
# SOCKS5 или HTTP-прокси вместо прямого соединения.
#
# connectMode — режим подключения:
#   "direct" (по умолчанию, если строка не указана вовсе) — только
#             напрямую, как было всегда. connectProxy ниже не читается.
#   "proxy"  — только через connectProxy, перебираются по очереди в том
#             порядке, в каком перечислены, пока один не сработает.
#             Прямое подключение НЕ пробуется вообще.
#   "auto"   — сначала пробуем напрямую; если не получилось — перебираем
#             connectProxy по очереди. Самый отказоустойчивый вариант.
#
# connectMode = "auto"

# Список прокси-серверов — нужен только если connectMode = "proxy" или
# "auto". Можно указать сколько угодно секций [[connectProxy]] — при
# каждой попытке подключения/переподключения перебираются по порядку,
# в котором перечислены (и с самого начала списка, если ранее
# успешное соединение оборвалось).
#
# [[connectProxy]]
# type = "socks5"              # "socks5" или "http"
# addr = "127.0.0.1:1080"      # host:port самого прокси-сервера
# auth = false                 # true — если прокси требует логин/пароль
# user = ""                    # используется только если auth = true
# pass = ""                    # используется только если auth = true
#
# [[connectProxy]]
# type = "http"
# addr = "proxy2.example.com:8080"
# auth = true
# user = "myuser"
# pass = "mypass"


# ── 3. Пароль для встроенного SSH-сервера ───────────────────────────────────

# Пароль, который вводишь при подключении: ssh user@vps -p remotePort
# (remotePort смотри ниже, в секции [[proxies]]). Имя пользователя ("user"
# в примере) может быть любым — программа проверяет ТОЛЬКО пароль.
#
# Приоритет, откуда программа реально берёт пароль (если задано несколько
# способов сразу — используется первый по списку):
#   1. Переменная окружения WINSSH_PASSWORD
#   2. Вот это поле, winsshPassword
#   3. Файл password.txt рядом с конфигом (старый способ, для совместимости)
winsshPassword = "ВАШ_SSH_ПАРОЛЬ"


# ── 4. Стартовая папка после входа (опционально) ────────────────────────────

# Куда попадаешь сразу после входа по SSH, и откуда выполняются одиночные
# команды вида "ssh user@vps -p remotePort dir". Пусто/закомментировано —
# стандартное поведение cmd.exe (обычно папка самой программы).
#
# Можно использовать переменные окружения Windows в формате %ИМЯ% — так
# же, как в самом cmd.exe. winssh-tunnel раскрывает их сам (обычный
# cmd.exe их не увидит, они читаются из файла, а не вводятся в консоли):
#   shellDir = "%USERPROFILE%\\Desktop"       -> C:\Users\ИмяПользователя\Desktop
#   shellDir = "%SystemDrive%\\myfolder"      -> C:\myfolder
#   shellDir = "%SystemDrive%%HOMEPATH%"      -> склейка без разделителя тоже работает
# Если переменной с таким именем нет — %ИМЯ% остаётся как есть, без ошибки
# (так же ведёт себя и сам cmd.exe).
#
# Путь можно писать и просто буквально — двойные и одинарные (прямые)
# слэши в TOML одинаково валидны:
#   shellDir = "C:\\Users\\user\\Desktop"
#   shellDir = "C:/Users/user/Desktop"
#
# shellDir = "%USERPROFILE%\\Desktop"


# ── 5. Туннели (проксируемые сервисы) ────────────────────────────────────────

# Одна секция [[proxies]] — один проброшенный наружу сервис. Можно
# добавлять сколько угодно секций, каждая регистрируется независимо, без
# пересборки exe — просто добавь/убери секцию и перезапусти программу.

# ── SSH (обязательный прокси — для этого всё затевалось) ──
#
# Флаг "winssh = true" говорит программе: "localPort вот этого прокси —
# это порт, на котором должен слушать встроенный SSH-сервер". Поставь
# этот флаг РОВНО у одного прокси (у того, что ведёт на localPort
# встроенного sshd) — тогда localPort достаточно поменять один раз,
# в одном месте, и всё само подхватится, дублировать это число в конфиге
# больше нигде не нужно.
[[proxies]]
name = "winssh"           # произвольное имя, для твоего удобства в логах
type = "tcp"
winssh = true              # ← отмечает этот прокси как встроенный SSH
localPort = 2222           # порт встроенного sshd; смени, если 2222 занят
remotePort = 65000         # внешний порт на frps — свободный порт по твоему выбору

# ── RDP (Remote Desktop) — раскомментируй если нужен удалённый рабочий стол ──
# Никакого отношения к нашему sshd не имеет — это просто TCP-туннель до
# системного RDP-сервиса Windows (порт 3389 по умолчанию).
# [[proxies]]
# name = "rdp"
# type = "tcp"
# localPort = 3389
# remotePort = 65001

# ── SMB (доступ к файлам по сети) — раскомментируй если нужен ──
# [[proxies]]
# name = "smb"
# type = "tcp"
# localPort = 445
# remotePort = 65002

# ── Ещё один пример: любой другой TCP-сервис на Windows-машине ──
# Например, локально запущенный веб-сервер, база данных и т.д. — принцип
# тот же: localPort — где сервис слушает НА Windows-машине, remotePort —
# на каком порту он будет доступен СНАРУЖИ через твой VPS.
# [[proxies]]
# name = "мой-сервис"
# type = "tcp"
# localPort = 8080
# remotePort = 65003


# ══════════════════════════════════════════════════════════════════════════
#  Поддерживаемые типы прокси (ограничение самого tiny-frpc):
#    tcp    — обычный TCP-туннель (SSH, RDP, SMB, любой TCP-сервис)
#    http   — HTTP-приложения
#    https  — HTTPS-приложения
#    tcpmux — multiplexed TCP (нестандартное, редко нужно)
#    stcp   — secret TCP (нужна отдельная пара "visitor" для доступа)
#
#  UDP НЕ поддерживается вообще (ограничение tiny-frpc). RDP и SMB на UDP
#  не завязаны, так что для типичных сценариев это не проблема.
# ══════════════════════════════════════════════════════════════════════════


# ── Шпаргалка: как это использовать ─────────────────────────────────────────

# 1. Заполни секции 1 и 3 выше (адрес VPS, токен, пароль).
# 2. Запусти winssh-tunnel.exe (двойным кликом, либо как службу — см.
#    README.md, раздел "Установка как службы").
# 3. С другой машины подключайся:
#      ssh -p 65000 user@ВАШ_VPS_IP_ИЛИ_ДОМЕН
#    (пароль — тот, что указал в winsshPassword; имя пользователя —
#    любое, программа его не проверяет)
# 4. Если что-то не так — смотри лог программы (окно консоли, либо
#    Event Viewer, если запущено как служба) — там будут понятные
#    русскоязычные сообщения об ошибках.


# ── Дополнительно: переменные окружения для запуска ─────────────────────────

# Пароль тоже можно хранить в переменной окружения вместо файла:
#   set WINSSH_PASSWORD=твой_пароль
#   winssh-tunnel.exe
# (см. приоритет в секции 3 выше — WINSSH_PASSWORD побеждает всегда)
